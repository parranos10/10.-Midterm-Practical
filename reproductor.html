<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reproductor - Youtube</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body style="background-color: #000000; color: white;">

<header class="encabezado">
    <a href="index.html" class="logo-area" style="text-decoration: none; color: white;">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSskqKoU9CXrPFsrcvFQPYZqweeHfycPcnR-DJtSABUHg&s=10" width="40" height="40" class="menu">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQp2B3GcNPfSo1SepwHJIcOV0ROrH5S3uZxSCMipcA8JQ&s=10" width="40" height="40" class="menu">
        <p>Youtube</p>
    </a>
</header>


<main style="display: flex; flex-wrap: wrap; padding: 20px; gap: 20px;">
   
    <section style="flex: 2; min-width: 300px;">
        <div id="video-container">
        </div>
        <h2 id="titulo-video">Cargando...</h2>
        <p id="detalles-video" class="detalles"></p>
        
        <hr style="border-color: #333;">

       
        <h3>Comentarios</h3>
        <div style="margin-bottom: 20px;">
            <input type="text" id="input-autor" placeholder="Tu nombre" style="width: 20%; padding: 5px; margin-right: 10px;">
            <input type="text" id="input-comentario" placeholder="Escribe un comentario..." style="width: 50%; padding: 5px; margin-right: 10px;">
            <button id="btn-comentar" style="padding: 5px 15px; cursor: pointer;">Comentar</button>
        </div>
        <div id="lista-comentarios">
            
        </div>
    </section>

   
    <aside style="flex: 1; min-width: 250px;">
        <h3>Recomendados</h3>
        <div id="lista-recomendaciones" style="display: flex; flex-direction: column; gap: 15px;">
        </div>
    </aside>

</main>

<script src="reproductor.js"></script>
</body>
</html>
